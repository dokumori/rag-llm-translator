services:
  chroma:
    container_name: chroma
    image: chromadb/chroma:1.4.0
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - chroma_data:/data
    environment:
      - PERSIST_DIRECTORY=/data
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "grep -q '00000000:1F40 00000000:0000 0A' /proc/net/tcp || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag-proxy:
    build:
      context: .
      dockerfile: ./services/rag-proxy/Dockerfile
    container_name: rag-proxy
    ports:
      - "5001:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_API_TOKEN=${LLM_API_TOKEN}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - HF_HOME=/app/data/cache/huggingface
      - SYSTEM_PROMPT_PATH=/app/system_prompt.md
      - MODELS_CONFIG_PATH=/app/config/models.json
    volumes:
      # Mount config so you can edit prompt without rebuilding
      - ./config/system_prompt.md:/app/system_prompt.md:ro
      # Mount shared model configuration
      - ./config/models.json:/app/config/models.json:ro
      # Map the cache directory
      - ./data/cache:/app/data/cache
      # Restore code mount for hot-reloading/easy restarts
      - ./services/rag-proxy/src/app.py:/app/app.py
      # Test-related
      - ./tests:/app/tests:ro
    depends_on:
      chroma:
        # Ensures rag-proxy only starts after ChromaDB is ready to accept connections
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "grep -q '00000000:1388 00000000:0000 0A' /proc/net/tcp || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network
    user: "${UID}:${GID}"

  toolbox:
    container_name: toolbox
    build:
      context: .
      dockerfile: ./services/toolbox/Dockerfile
    # Keep it running so we can 'docker exec' into it, or use 'profiles' to run on demand
    command: tail -f /dev/null
    user: "${UID}:${GID}"
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - HF_HOME=/app/data/cache/huggingface
      # Passed from .env to the container for translate_runner.py
      - TARGET_LANG=${TARGET_LANG}
      - TM_SOURCE_DIR=/app/tm_source
      - RAG_ANALYSIS_DIR=/app/data/rag-analysis
      - POST_PROCESS_INPUT_DIR=/app/po/output
      - OPENAI_BASE_URL=http://rag-proxy:5000/v1
      - PYTHONPATH=/app/src
    volumes:
      # Mount shared model configuration
      - ./config/models.json:/app/config/models.json:ro
      # Map the toolbox source scripts
      - ./services/toolbox/src:/app/src
      # Map the data directories relative to the root
      - ./data/tm_source:/app/tm_source
      - ./data/translations:/app/po
      # Map the destination directory for RAG analysis results
      - ./data/rag-analysis:/app/data/rag-analysis
      # Map the cache directory
      - ./data/cache:/app/data/cache
      # Test-related
      - ./tests:/app/tests:ro
    depends_on:
      chroma:
        # Prevents toolbox scripts from failing due to database connection errors during boot
        condition: service_healthy
      rag-proxy:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  chroma_data:
