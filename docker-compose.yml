services:
  # 1. Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma-db
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  # 2. RAG Proxy
  rag-proxy:
    volumes:
      - ./system_prompt.md:/app/system_prompt.md:ro  # Mount the prompt file
      - ./proxy/app.py:/app/app.py:ro
    build: ./proxy
    container_name: rag-proxy
    depends_on:
      - chroma
    ports:
      - "5001:5000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - PYTHONUNBUFFERED=1

# 3. UTILITY (DATA INGESTOR)
  ingestor:
    build: ./scripts
    container_name: rag-ingestor
    depends_on:
      - chroma
    volumes:
      # Mount the source data so the script can read it
      - ./tm_source:/app/tm_source
      - ./scripts:/app
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000

# 4. Translator Too
  translator:
    image: ghcr.io/pescheckit/python-gpt-po:latest
    platform: linux/amd64
    container_name: drupal-translator
    depends_on:
      - rag-proxy
    volumes:
      - ./po:/app/po                     # Access to both untranslated and translated folders
    environment:
      - ANTHROPIC_BASE_URL=http://rag-proxy:5000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    entrypoint: ["tail", "-f", "/dev/null"]
