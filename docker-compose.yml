services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - ./data/chroma_db:/chroma/chroma
    networks:
      - app_network

  rag-proxy:
    build: ./services/rag-proxy
    container_name: rag-proxy
    ports:
      - "5001:5000"
    environment:
      - AMAZEE_API_KEY=${AMAZEE_API_TOKEN} # Maps env var to container
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - HF_HOME=/app/data/cache/huggingface
    volumes:
      # Mount config so you can edit prompt without rebuilding
      - ./config/system_prompt.md:/app/system_prompt.md:ro
      # Mount the list of models
      - ./config/models.json:/app/config/models.json:ro
      # Map the cache directory
      - ./data/cache:/app/data/cache
    depends_on:
      - chroma
    networks:
      - app_network
    user: "${UID}:${GID}"
  # This container acts as your "swiss army knife" for tasks
  toolbox:
    build: ./services/toolbox
    # Keep it running so we can 'docker exec' into it, or use 'profiles' to run on demand
    command: tail -f /dev/null
    user: "${UID}:${GID}"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - HF_HOME=/app/data/cache/huggingface
    volumes:
      # Map the data directories relative to the root
      - ./data/glossary:/app/tm_source
      - ./data/translations:/app/po
      # Map source code for hot-reloading scripts during dev
      - ./services/toolbox/src:/app/src
      # Mount the list of models
      - ./config/models.json:/app/config/models.json:ro
      # Map the destination directory for RAG analysis results
      - ./data/rag-analysis:/app/data/rag-analysis
      # Map the cache directory
      - ./data/cache:/app/data/cache
    depends_on:
      - chroma
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
