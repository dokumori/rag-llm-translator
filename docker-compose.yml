services:
  chroma:
    container_name: chroma
    image: chromadb/chroma:latest
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - chroma_data:/data
    environment:
      - PERSIST_DIRECTORY=/data
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - app_network
    healthcheck:
      test: [ "CMD-SHELL", "grep -q '00000000:1F40 00000000:0000 0A' /proc/net/tcp || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag-proxy:
    build: ./services/rag-proxy
    container_name: rag-proxy
    ports:
      - "5001:5000"
    environment:
      - AMAZEE_API_KEY=${AMAZEE_API_TOKEN}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - HF_HOME=/app/data/cache/huggingface
    volumes:
      # Mount config so you can edit prompt without rebuilding
      - ./config/system_prompt.md:/app/system_prompt.md:ro
      # Mount shared model configuration
      - ./config/models.json:/app/config/models.json:ro
      # Map the cache directory
      - ./data/cache:/app/data/cache
      # Restore code mount for hot-reloading/easy restarts
      - ./services/rag-proxy/src/app.py:/app/app.py
    depends_on:
      chroma:
        # Ensures rag-proxy only starts after ChromaDB is ready to accept connections
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "grep -q '00000000:1388 00000000:0000 0A' /proc/net/tcp || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app_network
    user: "${UID}:${GID}"

  toolbox:
    container_name: toolbox
    build: ./services/toolbox
    # Keep it running so we can 'docker exec' into it, or use 'profiles' to run on demand
    command: tail -f /dev/null
    user: "${UID}:${GID}"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - HF_HOME=/app/data/cache/huggingface
      # Passed from .env to the container for translate_runner.py
      - TARGET_LANG=${TARGET_LANG}
    volumes:
      # Mount shared model configuration
      - ./config/models.json:/app/config/models.json:ro
      # Map the toolbox source scripts
      - ./services/toolbox/src:/app/src
      # Map the data directories relative to the root
      - ./data/glossary:/app/tm_source
      - ./data/translations:/app/po
      # Map the destination directory for RAG analysis results
      - ./data/rag-analysis:/app/data/rag-analysis
      # Map the cache directory
      - ./data/cache:/app/data/cache
    depends_on:
      chroma:
        # Prevents toolbox scripts from failing due to database connection errors during boot
        condition: service_healthy
      rag-proxy:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  chroma_data:
