# config/models/models.example.yaml — Template for model configuration.
# This file is the SOURCE used by bin/setup.sh to generate config/models/models.yaml.
# DO NOT edit config/models/models.yaml directly — run bin/setup.sh to regenerate it.
#
# To add a new well-known model, add an entry here and commit this file.
# Custom/Ollama entries are injected at setup time; do not add them here.

models:

  # ── Anthropic ────────────────────────────────────────────────────────────────
  # Source: https://docs.anthropic.com/en/docs/about-claude/pricing (2026-10-21)
  - id: claude-haiku-4-5
    name: Claude Haiku 4.5
    provider: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    pricing:
      prompt_per_1k_tokens: 0.001
      completion_per_1k_tokens: 0.005

  - id: claude-sonnet-4-6
    name: Claude Sonnet 4.6
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    pricing:
      prompt_per_1k_tokens: 0.003
      completion_per_1k_tokens: 0.015

  - id: claude-opus-4-7
    name: Claude Opus 4.7
    provider: anthropic
    model: claude-opus-4-7
    api_key_env: ANTHROPIC_API_KEY
    # Rejects sampling parameters with a 400; callers send temperature=0.
    additional_drop_params: [temperature]
    pricing:
      prompt_per_1k_tokens: 0.005
      completion_per_1k_tokens: 0.025

  # 5.5 generation: thinking is on by default (Opus 5.5 cannot turn it off) and
  # non-default sampling parameters are rejected with a 400.
  - id: claude-haiku-5-5
    name: Claude Haiku 5.5
    provider: anthropic
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    additional_drop_params: [temperature]
    # Rates for prompts up to 100K tokens ($0.50 / $2.50 per 1M beyond);
    # translation batches stay well below that.
    pricing:
      prompt_per_1k_tokens: 0.0001
      completion_per_1k_tokens: 0.0005

  - id: claude-sonnet-5-5
    name: Claude Sonnet 5.5
    provider: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    additional_drop_params: [temperature]
    pricing:
      prompt_per_1k_tokens: 0.002
      completion_per_1k_tokens: 0.010

  - id: claude-opus-5-5
    name: Claude Opus 5.5
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    additional_drop_params: [temperature]
    pricing:
      prompt_per_1k_tokens: 0.004
      completion_per_1k_tokens: 0.020

  # ── Google ───────────────────────────────────────────────────────────────────
  # Source: https://ai.google.dev/gemini-api/docs/models (2026-10-22)
  # Pricing: https://ai.google.dev/gemini-api/docs/pricing (standard tier, per 1M tokens)
  # The 2.5 models have no shutdown date but are three generations behind.

  - id: gemini-3-5-flash-lite
    name: Gemini 3.5 Flash-Lite
    provider: google
    model: gemini/gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY
    pricing:
      prompt_per_1k_tokens: 0.0003
      completion_per_1k_tokens: 0.0025

  - id: gemini-3-8-flash
    name: Gemini 3.8 Flash
    provider: google
    model: gemini/gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    # Rises to $1.50 / $7.50 per 1M from 2027-01-01.
    pricing:
      prompt_per_1k_tokens: 0.00075
      completion_per_1k_tokens: 0.00375

  - id: gemini-4-argon
    name: Gemini 4 Argon
    provider: google
    model: gemini/gemini-4-argon
    api_key_env: GEMINI_API_KEY
    # Rises to $4.00 / $20.00 per 1M from 2026-12-01.
    pricing:
      prompt_per_1k_tokens: 0.002
      completion_per_1k_tokens: 0.010

  # ── OpenAI ───────────────────────────────────────────────────────────────────
  # Source: https://developers.openai.com/api/docs/pricing (2026-10-22)
  # gpt-4.1-nano shuts down 2026-10-23, o3 2026-12-11, gpt-4.1 and
  # gpt-4.1-mini 2027-01-14 (https://developers.openai.com/api/docs/deprecations).

  - id: gpt-6-luna
    name: GPT-6 Luna
    provider: openai
    model: gpt-6-luna
    api_key_env: OPENAI_API_KEY
    pricing:
      prompt_per_1k_tokens: 0.0001
      completion_per_1k_tokens: 0.0005

  - id: gpt-5-4-mini
    name: GPT-5.4 Mini
    provider: openai
    model: gpt-5.4-mini
    api_key_env: OPENAI_API_KEY
    pricing:
      prompt_per_1k_tokens: 0.00075
      completion_per_1k_tokens: 0.0045

  # ── Mistral ──────────────────────────────────────────────────────────────────
  # Source: https://mistral.ai/technology/#models (2026-05-22)
  # mistral-medium-latest is discontinued; lineup is now Small 4 + Large 3.

  - id: mistral-small
    name: Mistral Small
    provider: mistral
    model: mistral-small-latest
    api_key_env: MISTRAL_API_KEY
    pricing:
      prompt_per_1k_tokens: 0.00015
      completion_per_1k_tokens: 0.0006

  - id: mistral-large
    name: Mistral Large
    provider: mistral
    model: mistral-large-latest
    api_key_env: MISTRAL_API_KEY
    pricing:
      prompt_per_1k_tokens: 0.0005
      completion_per_1k_tokens: 0.0015

  # ── Dry-run sentinel (always included, regardless of provider selection) ──────
  - id: dry-run-dummy
    name: Dry Run (No API calls)
    is_dry_run: true
